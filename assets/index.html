<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>linkbox</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#22272e; --fg:#e6edf3; --dim:#8b949e;
    --up:#3fb950; --warn:#d29922; --down:#f85149; --off:#6e7681; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:18px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;letter-spacing:.5px}
  h1 b{color:var(--accent)}
  .meta{color:var(--dim);font-size:12px}
  main{padding:20px 22px;max-width:1180px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;
    text-transform:uppercase;letter-spacing:.8px;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:hover td{background:#141922}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;
    font-weight:600;letter-spacing:.4px}
  .up{background:rgba(63,185,80,.16);color:var(--up)}
  .degraded{background:rgba(210,153,34,.16);color:var(--warn)}
  .down{background:rgba(248,81,73,.16);color:var(--down)}
  .dialing{background:rgba(88,166,255,.16);color:var(--accent)}
  .disabled{background:rgba(110,118,129,.16);color:var(--off)}
  .rtt{font-variant-numeric:tabular-nums}
  .dim{color:var(--dim)}
  .small{font-size:11px}
  button{background:#21262d;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{background:#262c34;border-color:#30363d}
  button.primary{background:#1f6feb;border-color:#1f6feb}
  button.primary:hover{background:#2f7ff0}
  button.on{background:rgba(63,185,80,.18);border-color:rgba(63,185,80,.4);color:var(--up)}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .log{margin-top:6px;color:var(--dim);font-size:11px;white-space:pre-wrap;
    max-height:74px;overflow:auto;background:#10151c;border-radius:6px;padding:6px 8px}
  .err{color:var(--down)}
  .sec{margin-top:26px}
  .sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--dim);margin:0 0 10px}
  textarea{width:100%;min-height:280px;background:#0b0f14;color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:12px;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
  .bar{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .toast{position:fixed;right:18px;bottom:18px;background:#1f6feb;color:#fff;
    padding:9px 14px;border-radius:8px;font-size:12px;opacity:0;
    transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .tok{display:flex;gap:8px;align-items:center}
  input{background:#0b0f14;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 9px;font:inherit;font-size:12px;width:210px}
</style>
</head>
<body>
<header>
  <h1><b>linkbox</b> <span class="dim">/</span> reverse tunnel supervisor</h1>
  <span class="meta" id="hdr">connecting…</span>
  <span style="flex:1"></span>
  <span class="tok">
    <input id="token" placeholder="bearer token (if set)" type="password">
    <button id="saveToken">set</button>
  </span>
</header>

<main>
  <table>
    <thead>
      <tr>
        <th>tunnel</th><th>status</th><th>forward</th><th>health</th>
        <th>up</th><th>pid</th><th>actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="sec">
    <h2>config</h2>
    <textarea id="cfg" spellcheck="false"></textarea>
    <div class="bar">
      <button class="primary" id="saveCfg">save &amp; reload</button>
      <button id="reloadCfg">reload from disk</button>
      <span class="meta" id="cfgPath"></span>
      <span class="meta" id="cfgStatus"></span>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem('linkbox_token') || '';
if (token) $('#token').value = token;

function headers(json) {
  const h = {};
  if (json) h['content-type'] = 'application/json';
  if (token) h['authorization'] = 'Bearer ' + token;
  return h;
}

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.background = bad ? '#da3633' : '#1f6feb';
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

function fmtDur(sec) {
  if (sec == null) return '—';
  const s = Math.max(0, sec);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function render(st) {
  $('#hdr').textContent =
    `${st.tunnels.length} tunnel(s) · started ${fmtDur(st.now - st.started_at)} ago · ${st.config_path}`;
  const rows = st.tunnels.map(t => {
    const h = t.health;
    const rtt = h ? (h.rtt_ms != null ? h.rtt_ms + ' ms' : '') : '';
    const health = h
      ? `<span class="pill ${h.ok ? 'up' : 'down'}">${h.ok ? 'ok' : 'fail'}</span>
         <span class="rtt">${esc(rtt)}</span>
         <div class="small dim">${esc(h.detail)}</div>`
      : '<span class="dim small">no probe yet</span>';
    const up = t.up_since ? fmtDur(st.now - t.up_since) : '—';
    const err = t.last_error
      ? `<div class="small err">${esc(t.last_error)}</div>` : '';
    const log = t.log_tail && t.log_tail.length
      ? `<div class="log">${esc(t.log_tail.slice(-6).join('\n'))}</div>` : '';
    return `<tr>
      <td><b>${esc(t.name)}</b>
        <div class="small dim">${esc(t.target)}</div>
        ${t.via_socks ? `<div class="small dim">via ${esc(t.via_socks)}</div>` : ''}</td>
      <td><span class="pill ${t.phase}">${t.phase}</span>
        ${err}
        <div class="small dim">tries ${t.attempts} · restarts ${t.restarts}</div></td>
      <td class="small">${esc(t.remote_spec)}<div class="dim">→ ${esc(t.target)}</div></td>
      <td>${health}</td>
      <td class="rtt">${up}</td>
      <td class="dim">${t.pid ?? '—'}</td>
      <td>
        <div class="row-actions">
          <button onclick="restart('${esc(t.name)}')">restart</button>
          <button class="${t.phase === 'disabled' ? 'on' : ''}"
            onclick="toggle('${esc(t.name)}', ${t.phase === 'disabled'})">
            ${t.phase === 'disabled' ? 'enable' : 'disable'}
          </button>
        </div>
        ${log}
      </td>
    </tr>`;
  }).join('');
  $('#rows').innerHTML = rows || `<tr><td colspan="7" class="dim">no tunnels configured</td></tr>`;
}

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: headers(!!opts.body), ...opts});
  if (r.status === 401) { toast('bad or missing token', true); throw new Error('401'); }
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

async function refresh() {
  try {
    render(await api('/api/state'));
  } catch (e) { /* transient */ }
}

async function loadConfig() {
  const d = await api('/api/config');
  $('#cfg').value = d.text;
  $('#cfgPath').textContent = d.path;
}

async function restart(name) {
  await api(`/api/tunnels/${name}/restart`, {method: 'POST'});
  toast(`restarting ${name}`);
  refresh();
}

async function toggle(name, enable) {
  await api(`/api/tunnels/${name}/${enable ? 'enable' : 'disable'}`, {method: 'POST'});
  toast(`${name} ${enable ? 'enabled' : 'disabled'}`);
  refresh();
}

$('#saveCfg').onclick = async () => {
  try {
    const r = await api('/api/config', {
      method: 'POST',
      body: JSON.stringify({text: $('#cfg').value})
    });
    if (r && r.ok === false) { toast('save failed', true); return; }
    $('#cfgStatus').textContent = 'saved';
    toast('config saved, reloading tunnels');
    setTimeout(refresh, 400);
  } catch (e) {
    $('#cfgStatus').textContent = 'invalid config';
    toast('config rejected: ' + e.message, true);
  }
};

$('#reloadCfg').onclick = loadConfig;
$('#saveToken').onclick = () => {
  token = $('#token').value.trim();
  localStorage.setItem('linkbox_token', token);
  toast('token stored');
  refresh();
};

loadConfig();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
