<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>linkbox</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#22272e; --fg:#e6edf3; --dim:#8b949e;
    --up:#3fb950; --warn:#d29922; --down:#f85149; --off:#6e7681; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:18px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;letter-spacing:.5px}
  h1 b{color:var(--accent)}
  .meta{color:var(--dim);font-size:12px}
  main{padding:20px 22px;max-width:1180px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;
    text-transform:uppercase;letter-spacing:.8px;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:hover td{background:#141922}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;
    font-weight:600;letter-spacing:.4px}
  .up{background:rgba(63,185,80,.16);color:var(--up)}
  .degraded{background:rgba(210,153,34,.16);color:var(--warn)}
  .down{background:rgba(248,81,73,.16);color:var(--down)}
  .dialing{background:rgba(88,166,255,.16);color:var(--accent)}
  .disabled{background:rgba(110,118,129,.16);color:var(--off)}
  /* the remote port is held by something that is not us: retrying is useless */
  .conflict{background:rgba(210,153,34,.22);color:var(--warn);
    box-shadow:inset 0 0 0 1px rgba(210,153,34,.45)}
  /* needs a human: a key is missing or wrong */
  .authfailed{background:rgba(248,81,73,.22);color:var(--down);
    box-shadow:inset 0 0 0 1px rgba(248,81,73,.5)}
  .rtt{font-variant-numeric:tabular-nums}
  .dim{color:var(--dim)}
  .small{font-size:11px}
  button{background:#21262d;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{background:#262c34;border-color:#30363d}
  button.primary{background:#1f6feb;border-color:#1f6feb}
  button.primary:hover{background:#2f7ff0}
  button.on{background:rgba(63,185,80,.18);border-color:rgba(63,185,80,.4);color:var(--up)}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .log{margin-top:6px;color:var(--dim);font-size:11px;white-space:pre-wrap;
    max-height:74px;overflow:auto;background:#10151c;border-radius:6px;padding:6px 8px}
  .err{color:var(--down)}
  .sec{margin-top:26px}
  .sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--dim);margin:0 0 10px}
  textarea{width:100%;min-height:280px;background:#0b0f14;color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:12px;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
  .bar{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .toast{position:fixed;right:18px;bottom:18px;background:#1f6feb;color:#fff;
    padding:9px 14px;border-radius:8px;font-size:12px;opacity:0;
    transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .tok{display:flex;gap:8px;align-items:center}
  input{background:#0b0f14;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 9px;font:inherit;font-size:12px;width:210px}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:12px;padding:22px;width:min(680px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.62)}
  dialog h3{margin:0 0 16px;font-size:14px;letter-spacing:.4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .grid label{display:flex;flex-direction:column;gap:5px;font-size:11px;
    color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .grid input{width:100%}
  .chk{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:12px;color:var(--dim)}
  .chk input{width:auto}
  .danger:hover{background:rgba(248,81,73,.16);border-color:rgba(248,81,73,.5);color:var(--down)}
</style>
</head>
<body>
<header>
  <h1><b>linkbox</b> <span class="dim">/</span> reverse tunnel supervisor</h1>
  <span class="meta" id="hdr">connecting…</span>
  <span style="flex:1"></span>
  <span class="tok">
    <input id="token" placeholder="bearer token (if set)" type="password">
    <button id="saveToken">set</button>
  </span>
</header>

<main>
  <div class="bar" style="margin:0 0 12px">
    <button class="primary" id="newTunnel">＋ new tunnel</button>
    <span class="meta" id="tblMeta"></span>
  </div>
  <table>
    <thead>
      <tr>
        <th>tunnel</th><th>status</th><th>forward</th><th>health</th>
        <th>up</th><th>pid</th><th>actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="sec">
    <h2>config</h2>
    <textarea id="cfg" spellcheck="false"></textarea>
    <div class="bar">
      <button class="primary" id="saveCfg">save &amp; reload</button>
      <button id="reloadCfg">reload from disk</button>
      <span class="meta" id="cfgPath"></span>
      <span class="meta" id="cfgStatus"></span>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<dialog id="dlg">
  <form id="tform">
    <h3 id="dlgTitle">new tunnel</h3>
    <div class="grid">
      <label>name<input id="f_name" placeholder="workbuddy-api" required>
        <span style="text-transform:none;letter-spacing:0">小写字母/数字/-/_，1–32 位</span></label>
      <label>remote host<input id="f_host" placeholder="152.53.165.119" required></label>
      <label>ssh port<input id="f_ssh_port" type="number" placeholder="22"></label>
      <label>ssh user<input id="f_ssh_user" placeholder="root"></label>
      <label>identity file<input id="f_identity" placeholder="/root/.ssh/cnb_key"></label>
      <label>via socks<input id="f_via_socks" placeholder="127.0.0.1:31002"></label>
      <label>remote bind<input id="f_remote_bind" placeholder="127.0.0.1"></label>
      <label>remote port<input id="f_remote_port" type="number" placeholder="7864" required></label>
      <label>local target<input id="f_local_target" placeholder="127.0.0.1:7864"></label>
      <label>health path<input id="f_health_path" placeholder="/dashboard"></label>
    </div>
    <label class="chk"><input id="f_enabled" type="checkbox" checked> enabled</label>
    <div class="small err" id="formErr" style="margin-top:10px;min-height:16px"></div>
    <div class="bar">
      <button class="primary" type="submit" id="dlgSave">save</button>
      <button type="button" id="dlgCancel">cancel</button>
      <span class="meta">留空的项走 [defaults]</span>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem('linkbox_token') || '';
if (token) $('#token').value = token;

function headers(json) {
  const h = {};
  if (json) h['content-type'] = 'application/json';
  if (token) h['authorization'] = 'Bearer ' + token;
  return h;
}

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.background = bad ? '#da3633' : '#1f6feb';
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

function fmtDur(sec) {
  if (sec == null) return '—';
  const s = Math.max(0, sec);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function render(st) {
  $('#hdr').textContent =
    `${st.tunnels.length} tunnel(s) · started ${fmtDur(st.now - st.started_at)} ago · ${st.config_path}`;
  const rows = st.tunnels.map(t => {
    const h = t.health;
    const rtt = h ? (h.rtt_ms != null ? h.rtt_ms + ' ms' : '') : '';
    // A timeout while the tunnel is still `up` is queueing, not failure: paint
    // it as a warning instead of crying wolf in red.
    const hClass = !h ? 'disabled' : h.ok ? 'up'
      : (t.phase === 'up' || h.kind === 'timeout') ? 'degraded' : 'down';
    const hLabel = !h ? '' : h.ok ? 'ok'
      : h.kind === 'timeout' ? 'slow'
      : h.kind === 'noforwarder' ? 'no fwd' : 'fail';
    const health = h
      ? `<span class="pill ${hClass}">${hLabel}</span>
         <span class="rtt">${esc(rtt)}</span>
         <div class="small dim">${esc(h.detail)}</div>`
      : '<span class="dim small">no probe yet</span>';
    const up = t.up_since ? fmtDur(st.now - t.up_since) : '—';
    const err = t.last_error
      ? `<div class="small err">${esc(t.last_error)}</div>` : '';
    const log = t.log_tail && t.log_tail.length
      ? `<div class="log">${esc(t.log_tail.slice(-6).join('\n'))}</div>` : '';
    return `<tr>
      <td><b>${esc(t.name)}</b>
        <div class="small dim">${esc(t.target)}</div>
        ${t.via_socks ? `<div class="small dim">via ${esc(t.via_socks)}</div>` : ''}</td>
      <td><span class="pill ${t.phase}">${t.phase}</span>
        ${err}
        <div class="small dim">tries ${t.attempts} · restarts ${t.restarts}</div></td>
      <td class="small">${esc(t.remote_spec)}<div class="dim">→ ${esc(t.target)}</div></td>
      <td>${health}</td>
      <td class="rtt">${up}</td>
      <td class="dim">${t.pid ?? '—'}</td>
      <td>
        <div class="row-actions">
          <button onclick="restart('${esc(t.name)}')">restart</button>
          <button class="${t.phase === 'disabled' ? 'on' : ''}"
            onclick="toggle('${esc(t.name)}', ${t.phase === 'disabled'})">
            ${t.phase === 'disabled' ? 'enable' : 'disable'}
          </button>
          <button onclick="editTunnel('${esc(t.name)}')">edit</button>
          <button class="danger" onclick="delTunnel('${esc(t.name)}')">delete</button>
        </div>
        ${log}
      </td>
    </tr>`;
  }).join('');
  $('#rows').innerHTML = rows || `<tr><td colspan="7" class="dim">还没有隧道 —— 点左上角 ＋ new tunnel 建一条</td></tr>`;
  $('#tblMeta').textContent = st.tunnels.length
    ? `${st.tunnels.filter(t => t.phase === 'up').length}/${st.tunnels.length} up` : '';
}

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: headers(!!opts.body), ...opts});
  if (r.status === 401) { toast('bad or missing token', true); throw new Error('401'); }
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

async function refresh() {
  try {
    render(await api('/api/state'));
  } catch (e) { /* transient */ }
}

async function loadConfig() {
  const d = await api('/api/config');
  $('#cfg').value = d.text;
  $('#cfgPath').textContent = d.path;
}

async function restart(name) {
  await api(`/api/tunnels/${name}/restart`, {method: 'POST'});
  toast(`restarting ${name}`);
  refresh();
}

async function toggle(name, enable) {
  await api(`/api/tunnels/${name}/${enable ? 'enable' : 'disable'}`, {method: 'POST'});
  toast(`${name} ${enable ? 'enabled' : 'disabled'}`);
  refresh();
}

$('#saveCfg').onclick = async () => {  try {
    const r = await api('/api/config', {
      method: 'POST',
      body: JSON.stringify({text: $('#cfg').value})
    });
    if (r && r.ok === false) { toast('save failed', true); return; }
    $('#cfgStatus').textContent = 'saved';
    toast('config saved, reloading tunnels');
    setTimeout(refresh, 400);
  } catch (e) {
    $('#cfgStatus').textContent = 'invalid config';
    toast('config rejected: ' + e.message, true);
  }
};

$('#reloadCfg').onclick = loadConfig;
$('#saveToken').onclick = () => {
  token = $('#token').value.trim();
  localStorage.setItem('linkbox_token', token);
  toast('token stored');
  refresh();
};

// ---------------------------------------------------------------- tunnel form

const FIELDS = ['name', 'host', 'ssh_port', 'ssh_user', 'identity', 'via_socks',
                'remote_bind', 'remote_port', 'local_target', 'health_path'];
let editingName = null;

function openForm(t, defaults) {
  editingName = t ? t.name : null;
  $('#dlgTitle').textContent = t ? `edit — ${t.name}` : 'new tunnel';
  $('#formErr').textContent = '';
  const df = defaults || {};
  const val = (k, fallback) => {
    const v = t && t[k] != null ? t[k] : (df[k] != null ? df[k] : fallback);
    return v == null ? '' : v;
  };
  $('#f_name').value = t ? t.name : '';
  $('#f_name').readOnly = !!t;
  $('#f_host').value = val('host', '');
  $('#f_ssh_port').value = val('ssh_port', df.ssh_port || '');
  $('#f_ssh_user').value = val('ssh_user', df.ssh_user || '');
  $('#f_identity').value = val('identity', '');
  $('#f_via_socks').value = val('via_socks', '');
  $('#f_remote_bind').value = val('remote_bind', '127.0.0.1');
  $('#f_remote_port').value = t ? t.remote_port : '';
  $('#f_local_target').value = val('local_target', '');
  $('#f_health_path').value = val('health_path', df.health_path || '');
  $('#f_enabled').checked = t ? t.enabled !== false : true;
  $('#dlg').showModal();
}

async function editTunnel(name) {
  try {
    const d = await api('/api/tunnels');
    const t = (d.tunnels || []).find(x => x.name === name);
    if (!t) { toast('隧道不在配置里了', true); return; }
    openForm(t, d.defaults);
  } catch (e) { toast('读取失败: ' + e.message, true); }
}

async function delTunnel(name) {
  if (!confirm(`删除隧道 ${name}？\n\n会从配置文件里删掉这一段，正在跑的转发会立即断开。`)) return;
  try {
    await api('/api/tunnels/' + encodeURIComponent(name), {method: 'DELETE'});
    toast(`已删除 ${name}`);
    refresh(); loadConfig();
  } catch (e) { toast('删除失败: ' + e.message, true); }
}

$('#newTunnel').onclick = async () => {
  let d = {defaults: {}};
  try { d = await api('/api/tunnels'); } catch (e) {}
  openForm(null, d.defaults);
};
$('#dlgCancel').onclick = () => $('#dlg').close();

$('#tform').onsubmit = async (e) => {
  e.preventDefault();
  const str = (id) => { const v = $(id).value.trim(); return v === '' ? null : v; };
  const num = (id) => { const v = $(id).value.trim(); return v === '' ? null : Number(v); };

  const name = $('#f_name').value.trim();
  if (!/^[a-z0-9_-]{1,32}$/.test(name)) {
    $('#formErr').textContent = 'name 只允许小写字母/数字/-/_，1–32 位';
    return;
  }
  if (!str('#f_host')) { $('#formErr').textContent = 'remote host 必填'; return; }
  const rp = num('#f_remote_port');
  if (!rp || rp < 1 || rp > 65535) { $('#formErr').textContent = 'remote port 必须是 1–65535'; return; }

  const body = {
    name,
    host: str('#f_host'),
    ssh_port: num('#f_ssh_port'),
    ssh_user: str('#f_ssh_user'),
    identity: str('#f_identity'),
    via_socks: str('#f_via_socks'),
    remote_bind: str('#f_remote_bind'),
    remote_port: rp,
    local_target: str('#f_local_target'),
    enabled: $('#f_enabled').checked,
    health_path: str('#f_health_path'),
    health_cmd: null,
    health_expect: null
  };

  const btn = $('#dlgSave');
  btn.disabled = true;
  try {
    const r = await fetch('/api/tunnels', {
      method: 'POST', headers: headers(true), body: JSON.stringify(body)
    });
    const txt = await r.text();
    if (!r.ok) {
      $('#formErr').textContent = txt.slice(0, 300);
      toast('保存被拒绝', true);
      return;
    }
    $('#dlg').close();
    toast(editingName ? `已更新 ${name}` : `已创建 ${name}，正在拨号…`);
    refresh(); loadConfig();
  } catch (err) {
    $('#formErr').textContent = String(err);
  } finally {
    btn.disabled = false;
  }
};

loadConfig();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
