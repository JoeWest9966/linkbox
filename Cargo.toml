[package]
name = "linkbox"
version = "0.1.0"
edition = "2024"
description = "Client-side reverse tunnel supervisor with a local control panel"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal", "net"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
serde_json = "1.0.154"

[profile.release]
opt-level = 2
lto = "thin"
